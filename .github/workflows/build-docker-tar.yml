name: Build Docker TAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: instagram-embed-discord-bot:latest
          outputs: type=docker,dest=${{ runner.temp }}/instagram-embed-discord-bot-linux-amd64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker TAR
        uses: actions/upload-artifact@v4
        with:
          name: instagram-embed-discord-bot-linux-amd64
          path: ${{ runner.temp }}/instagram-embed-discord-bot-linux-amd64.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
